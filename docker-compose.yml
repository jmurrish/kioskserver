services:
  web:
    image: nginx:1.27.2-alpine
    container_name: kiosk-nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8081:80"
    environment:
      - NGINX_HOST=foobar.com
      - NGINX_PORT=80

    tty: true
    networks:
      - kiosknet
    
    restart: unless-stopped

  



  app:
    container_name: kiosk-app
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
      
    ports:
      - "9001:9000"
    volumes:
      - .:/var/www/html
  
    networks:
      - kiosknet

    depends_on:
      - web

    restart: unless-stopped

  mysql:
      image: mysql:8.4.3
      container_name: kiosk-mysql
      volumes:
        - ./database/mysql:/var/lib/mysql
      networks:
        - kiosknet
      environment:
        - MYSQL_ROOT_PASSWORD=secret
        - MYSQL_DATABASE=kiosk
        - MYSQL_USER=kiosk
        - MYSQL_PASSWORD=BcPFmXohW6
      ports:
        - "3308:3306"

      restart: unless-stopped
      

networks:
  kiosknet  :
    driver: bridge

  
